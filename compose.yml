name: "demo-redis-bigquery"
services:
  redis:
    container_name: demo-redis-bigquery-redis
    image: "redis:alpine"
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  app:
    container_name: demo-redis-bigquery-app
    build:
      context: ./
      target: release
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      ENABLE_IMAGE_ENRICHMENT: ${ENABLE_IMAGE_ENRICHMENT:-false}
      NODE_ENV: production
      PORT: ${PORT:-8080}
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.docker
        required: false
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
